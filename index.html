<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Keren</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 400px;
        }
        h1 { margin-top: 0; color: #38bdf8; }
        p { color: #94a3b8; line-height: 1.6; }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Halo Dunia! 🚀</h1>
        <p>Website ini berhasil di-deploy langsung dari Termux di Android ke GitHub Pages secara gratis & permanen.</p>
        <a href="#" class="btn">Keren kan?</a>
    </div>
</body>
</html>
