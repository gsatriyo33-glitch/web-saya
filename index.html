<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Keren Satriyo</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3a8a, #0f172a);
            color: #f8fafc;
            font-family: system-ui, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 35px 25px;
            border-radius: 20px;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        h1 { margin-top: 0; color: #38bdf8; font-size: 26px; }
        p { color: #cbd5e1; font-size: 16px; line-height: 1.6; }
        .badge {
            background: #22c55e;
            color: #052e16;
            font-weight: 700;
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 999px;
            display: inline-block;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="box">
        <span class="badge">VERSI 2.0 AKTIF</span>
        <h1>Update Tampilan Berhasil! 🔥</h1>
        <p>Teks dan tampilan ini baru saja diubah langsung lewat Termux di Android.</p>
    </div>
</body>
</html>
